<div class="d-flex flex-column h-100">

  <!-- Componente de Chat(Header) -->

  <div class="header d-flex justify-content-center align-items-center">
    <div class="d-flex justify-content-between w-100">
      <div class="d-flex justify-content-between align-items-center">
        <!-- Imagem e nome do grupo -->
        <img [src]="choosenGroup.imageUrl" alt="Logo" class="user user-image">
        <div class="user-details d-flex flex-column mt-3">
          <!-- Contêiner para título e tags -->
          <div class="d-flex align-items-center">
            <h5 class="d-flex align-items-center mb-0">{{ choosenGroup.name }}</h5>
            <div class="group-tags ms-5">
              <span 
                *ngFor="let tag of choosenGroup.tags; let i = index" 
                [ngStyle]="{'background-color': getTagColor(tag)}" 
                class="group-tag"
              >
                {{ tag }}
              </span>
            </div>
          </div>
          <p class="small">{{ choosenGroup.participants }} participantes</p>
        </div>
      </div>

      <!-- Ícone de três pontos com dropdown -->
      <div class="d-flex justify-content-center align-items-center position-relative">
        <fa-icon *ngIf="selectTicketMode" [icon]="faX" class="close-icon" [matTooltip]="'Fechar abertura de chamado'"
          (click)="toggleSelectMode()"></fa-icon>
        <fa-icon *ngIf="selectTicketMode" [icon]="faTicketManager" matTooltip="Abrir chamado" class="manager-icon"
          (click)="sendMessagesForTicket()" [ngClass]="{'disabled-group': selectedMessages.length === 0}"></fa-icon>
        <fa-icon [icon]="faEllipsisV" class="manager-icon" (click)="toggleDropdownMenu($event)"></fa-icon>

        <!-- Dropdown de opções -->
        <div *ngIf="showDropdownMenu" class="dropdown-menu-manager">
          <div class="dropdown-item-manager" (click)="openGroupInfo()">Informações do Grupo</div>
          <div class="dropdown-item-manager" (click)="muteGroup()">Silenciar Grupo</div>
          <div class="dropdown-item-manager" (click)="toggleSelectMode()">Abrir Chamado</div>
          <div class="dropdown-item-manager" (click)="toggleTagDropdown($event)">Gerenciar Tags</div> <!-- Novo botão para tags -->
          <div class="dropdown-item-manager" (click)="exitGroup()">Sair do Grupo</div>
        </div>
        
        <!-- Dropdown de tags -->
        <div *ngIf="showTagDropdown" class="dropdown-tags-manager">
          <!-- Botão para criar nova tag -->
          <button *ngIf="!creatingNewTag && !editingTag" class="create-new-tag-btn" (click)="openTagCreation()">Criar Tag</button>
        
          <!-- Lista de Tags Disponíveis -->
          <div *ngIf="!creatingNewTag && !editingTag" class="tags-options">
            <div *ngFor="let tag of availableTags" class="form-check m-2">
              <div class="d-flex align-items-center">
                <input 
                  type="checkbox" 
                  [id]="tag.name" 
                  [checked]="selectedGroupTags.includes(tag.name)"
                  (change)="toggleTag(tag.name)"
                  class="form-check-input">
                
                <label 
                  [for]="tag.name" 
                  [ngStyle]="{'color': getTagColor(tag.name)}" 
                  class="ms-2 form-check-label">
                  {{ tag.name }}
                </label>
              </div>
            
              <div class="tag-icons">
              <fa-icon 
                *ngIf="!creatingNewTag && !editingTag" 
                [icon]="faPen" 
                (click)="openTagEdit(tag)" 
                class="edit-tag-icon">
              </fa-icon>
                
              <fa-icon 
                *ngIf="!creatingNewTag && !editingTag" 
                [icon]="faTrash" 
                (click)="deleteTag(tag)" 
                class="delete-tag-icon text-danger">
              </fa-icon>
              </div>
            </div>
          </div>
        
          <!-- Div para criar ou editar uma tag -->
          <div *ngIf="creatingNewTag || editingTag" class="create-tag-section">
            <input 
              type="text" 
              [(ngModel)]="newTagName" 
              placeholder="Nome da Tag" 
              class="tag-input">
            <div class="color-picker-wrapper">
              <label for="tagColor">Cor:</label>
              <input 
                type="text" 
                id="tagColor" 
                [(ngModel)]="newTagColor" 
                placeholder="#0aa82c"
                maxlength="7"
                class="color-input">
            </div>
            <div class="tag-buttons">
              <button (click)="addNewTag()" [disabled]="!newTagName || !newTagColor" class="save-tag-btn">Salvar</button>
              <button (click)="cancelTagCreation()" class="cancel-tag-btn">Cancelar</button>
            </div>
          </div>
        
          <!-- Botão para salvar as tags no grupo -->
          <button *ngIf="!creatingNewTag && !editingTag" (click)="saveTagsToGroup()" class="save-group-tags-btn">Salvar Tags</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Componente de Chat(Header) -->

  <!-- Componente de Chat(Body) -->
  <div class="messages-container p-3 flex-grow-1" #messagesContainer>
    <div *ngFor="let message of choosenGroup?.messages; let i = index" class="d-flex mb-2 w-100 align-items-center"
      [ngStyle]="{'justify-content': message.sender === userName ? 'end' : 'start'}">

      <!-- Checkbox para seleção -->
      <div *ngIf="selectTicketMode && message.sender !== userName" class="me-2">
        <input type="checkbox" class="form-check form-check-input custom-checkbox"
          [checked]="selectedMessages.includes(message)" (change)="toggleMessageSelection(message)" />
      </div>

      <!-- Mensagem -->
      <div class="message" [ngClass]="{
             'sent': message.sender === userName,
             'received': message.sender !== userName,
             'selected': selectedMessages.includes(message) && selectTicketMode
           }">
        <div class="d-flex justify-content-between">
          <strong>{{ message.sender }}</strong>
          <small>{{ message.formattedTime }}</small>
        </div>
        <p>{{ message.content }}</p>
      </div>

      <div *ngIf="selectTicketMode && message.sender === userName" class="ms-2">
        <input type="checkbox" class="form-check form-check-input custom-checkbox"
          [checked]="selectedMessages.includes(message)" (change)="toggleMessageSelection(message)" />
      </div>

    </div>
  </div>



  <div class="footer mt-auto w-100 p-3 bottom-0">
    <div class="d-flex w-100 row align-items-center">
      <!-- Ícone de Smile com evento de clique -->
      <div class="col-lg-1 position-relative">
        <fa-icon [icon]="faSmile" class="footer-icon" (click)="toggleEmojiPicker()"></fa-icon>

        <!-- Dropdown de Emojis -->
        <div *ngIf="showEmojiPicker" class="emoji-picker">
          <div class="emoji" *ngFor="let emoji of emojis" (click)="addEmoji(emoji)">
            {{ emoji }}
          </div>
        </div>
      </div>

      <div class="col-lg-1 position-relative">
        <fa-icon [icon]="faPlus" class="footer-icon" (click)="toggleDropdown()"></fa-icon>

        <!-- Dropdown de opções de envio -->
        <div *ngIf="showDropdown" class="dropdown-menu">
          <div class="dropdown-item" (click)="triggerFileInput('image')">
            <fa-icon [icon]="faImage"></fa-icon> Enviar Imagem
          </div>
          <div class="dropdown-item" (click)="triggerFileInput('file')">
            <fa-icon [icon]="faFile"></fa-icon> Enviar Arquivo
          </div>
        </div>
        <!-- Ícone de adicionar (para abrir o dropdown) -->

        <!-- Inputs de arquivos ocultos -->
        <input type="file" #imageInput accept="image/*" (change)="handleFileInput($event, 'image')"
          style="display: none;">
        <input type="file" #fileInput (change)="handleFileInput($event, 'file')" style="display: none;">
      </div>

      <!-- Input de mensagem -->
      <div class="col-lg-9 d-flex align-items-center">
        <input type="text" class="form-control" [(ngModel)]="newMessageContent" placeholder="Digite sua mensagem..."
          (keydown.enter)="sendMessage()">
      </div>

      <!-- Ícone de enviar mensagem -->
      <div class="col-lg-1">
        <fa-icon [icon]="faPaperPlane" class="footer-icon" (click)="sendMessage()"></fa-icon>
      </div>

    </div>
  </div>
  <!-- Componente de Chat(Body) -->

</div>
